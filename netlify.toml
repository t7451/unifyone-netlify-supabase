# UnifyOne — Netlify Deployment Configuration
# Full-stack: React SPA (dist/public) + Express via Netlify Functions

[build]
  base = ""
  command = "pnpm install --no-frozen-lockfile && NODE_ENV=production pnpm build && (node scripts/ping-sitemaps.mjs || true)"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-csp-nonce"
  [plugins.inputs]
    reportOnly = false
    unsafeEval = false
    excludedPath = ["/api/*", "/mcp"]

# Netlify Functions — use esbuild to bundle the TypeScript server function
[functions]
  node_bundler = "esbuild"
  included_files = ["drizzle/**", "server/**"]

# Routing note: Netlify Functions that declare an in-code `config.path` (server.ts
# → "/api/*", health.mts → "/api/health", blobs-serve.mts → "/blobs/*",
# mcp.mts → "/mcp", etc.) auto-route at that path. They are NOT served at
# `/.netlify/functions/<name>` — hitting that URL 404s. So do NOT add
# `force = true` redirects pointing at `/.netlify/functions/<name>`; that
# overrides the function's own auto-route with a dead target (this is exactly
# what previously broke /api/health and /mcp). Dedicated functions for specific
# paths (stripe webhook-async, golf, deploys/notify, flush-overages) likewise
# auto-route via their own config.path and win over the /api/* catch-all below.

# Catch-all for the main API server function. Redundant with server.ts's in-code
# config { path: "/api/*" }, kept as a non-force fallback (auto-route wins).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

# Netlify Blobs serving function — public reads of stored objects.
# blobs-serve.mts uses in-code config { path: "/blobs/*" }; non-force fallback.
[[redirects]]
  from = "/blobs/*"
  to = "/.netlify/functions/blobs-serve"
  status = 200

# Canonical host: redirect www → apex (requires www.1commerce.online to be
# added as a domain alias in the Netlify dashboard for this rule to fire).
[[redirects]]
  from = "https://www.1commerce.online/*"
  to = "https://1commerce.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.1commerce.online/*"
  to = "https://1commerce.online/:splat"
  status = 301
  force = true

# Force HTTPS for non-www HTTP requests
[[redirects]]
  from = "http://1commerce.online/*"
  to = "https://1commerce.online/:splat"
  status = 301
  force = true

# Governance should never resolve as a client-side route.
[[redirects]]
  from = "/governance"
  to = "/master-control"
  status = 301
  force = true

# Deprecated Manus AI surfaces — redirect to live equivalents.
[[redirects]]
  from = "/manus-ai"
  to = "/the-system"
  status = 301
  force = true

[[redirects]]
  from = "/blog/manus-ai-gig-workers"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blog/manus-ai"
  to = "/blog"
  status = 301
  force = true

# SEO content consolidation (Aug 2026): the "AEO" batch added 6 pages that
# duplicated existing /seo/gig.ts content under leftover ecommerce-platform
# slugs from the pre-pivot product positioning. Redirecting to the canonical
# gig-tax page each one duplicated, instead of leaving both live.
[[redirects]]
  from = "/seo/multi-tenant-ecommerce-platform"
  to = "/seo/consolidate-1099-income-tax-time"
  status = 301
  force = true

[[redirects]]
  from = "/seo/unify-inventory-multiple-stores"
  to = "/seo/track-gig-income-multiple-apps"
  status = 301
  force = true

[[redirects]]
  from = "/seo/unify-disconnected-sales-channels"
  to = "/seo/track-gig-income-multiple-apps"
  status = 301
  force = true

[[redirects]]
  from = "/seo/multi-channel-order-management"
  to = "/seo/quarterly-estimated-taxes-gig-workers"
  status = 301
  force = true

[[redirects]]
  from = "/seo/multi-store-management-platform"
  to = "/seo/track-gig-income-multiple-apps"
  status = 301
  force = true

[[redirects]]
  from = "/seo/real-time-inventory-sync"
  to = "/seo/how-much-to-set-aside-1099-taxes"
  status = 301
  force = true

# Slug renamed to match actual content (was a legacy "multi-tenant-commerce"
# ecommerce-platform slug on a page that's actually about data privacy).
[[redirects]]
  from = "/seo/unifyone-multi-tenant-commerce"
  to = "/seo/unifyone-data-privacy"
  status = 301
  force = true

# SPA fallback — all non-API routes serve the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io https://connect.facebook.net https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com https://assets.apollo.io https://tracker.searchableanalytics.com https://www.googletagmanager.com https://tagmanager.google.com https://www.google-analytics.com https://ssl.google-analytics.com https://analytics.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://td.doubleclick.net https://challenges.cloudflare.com; script-src-elem 'self' https://plausible.io https://connect.facebook.net https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com https://assets.apollo.io https://tracker.searchableanalytics.com https://www.googletagmanager.com https://tagmanager.google.com https://www.google-analytics.com https://ssl.google-analytics.com https://analytics.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://td.doubleclick.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tagmanager.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: https://d.impactradius-event.com https://www.googletagmanager.com https://ssl.gstatic.com https://www.gstatic.com https://www.google-analytics.com https://www.google.com https://googleads.g.doubleclick.net https://td.doubleclick.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://checkout.stripe.com https://api.paypal.com https://www.facebook.com https://plausible.io https://api.anthropic.com https://*.apollo.io https://*.workers.dev https://tracker.searchableanalytics.com https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://region1.google-analytics.com https://region1.analytics.google.com https://challenges.cloudflare.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.paypal.com https://www.googletagmanager.com https://td.doubleclick.net https://challenges.cloudflare.com; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# Ensure webhook routes accept Stripe POST requests
# CORS is locked down to production domain - webhooks are verified by signature
[[headers]]
  for = "/api/stripe/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://1commerce.online"
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature"

[[headers]]
  for = "/api/billing/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://1commerce.online"
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-DNS-Prefetch-Control = "off"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------------------
# Netlify-native integrations
# ----------------------------------------------------------------------------
# Netlify Blobs is enabled automatically — no toml config required. Server
# code uses it via server/storage.ts (STORAGE_BACKEND=auto by default).
#
# Image CDN: route blob image transforms through /.netlify/images. Example:
#   <img src="/.netlify/images?url=/blobs/products/foo.jpg&w=800&fit=cover">
# Allow remote sources for the Image CDN here:
[images]
  remote_images = [
    "^/blobs/.*",
    "^https://github\\.com/user-attachments/.*",
  ]

# Recommended Netlify extensions (install via Netlify UI → Extensions):
#   - Stripe       (auto-injects STRIPE_* env vars, dashboard widgets)
#   - Supabase     (auto-injects SUPABASE_* env vars; until removal completes)
#   - Neon         (auto-injects DATABASE_URL/NETLIFY_DATABASE_URL)
#   - Sentry       (release tracking + source maps)
