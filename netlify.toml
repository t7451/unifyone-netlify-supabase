# UnifyOne — Netlify Deployment Configuration
# Full-stack: React SPA (dist/public) + Express via Netlify Functions

[build]
  base = ""
  command = "pnpm install && pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  NODE_ENV = "production"

# Netlify Functions — use esbuild to bundle the TypeScript server function
[functions]
  node_bundler = "esbuild"
  included_files = ["drizzle/**", "server/**"]

# Redirect API calls to the Express server function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

# MCP (Model Context Protocol) server endpoint
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp-server/mcp"
  status = 200
  force = true

# SPA fallback — all non-API routes serve the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
