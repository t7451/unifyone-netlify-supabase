# UnifyOne — Netlify Deployment Configuration
# Full-stack: React SPA (dist/public) + Express via Netlify Functions

[build]
  base = ""
  command = "pnpm install --no-frozen-lockfile && NODE_ENV=production pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-csp-nonce"
  [plugins.inputs]
    reportOnly = false
    unsafeEval = false
    excludedPath = ["/api/*", "/mcp"]

# Netlify Functions — use esbuild to bundle the TypeScript server function
[functions]
  node_bundler = "esbuild"
  included_files = ["drizzle/**", "server/**"]

[[edge_functions]]
  path = "/api/auth/*"
  function = "rate-limit"

[[edge_functions]]
  path = "/api/oauth/*"
  function = "rate-limit"

# ── Specific API function routes — MUST come before the /api/* catch-all ──────
# These paths are owned by their own dedicated Netlify Functions, but the
# /api/* rewrite below would otherwise swallow them and hand the request to
# server.ts (which doesn't implement them → 404, or in the webhook-async case,
# was reaching the wrong handler). Listing them explicitly above the catch-all
# guarantees they reach the right function. force=true so they win even though
# the function also declares the same path via in-code config.
[[redirects]]
  from = "/api/stripe/webhook-async"
  to = "/.netlify/functions/stripe-webhook-background"
  status = 200
  force = true

[[redirects]]
  from = "/api/golf/order"
  to = "/.netlify/functions/golf-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/golf/config"
  to = "/.netlify/functions/golf-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/golf/logo-url"
  to = "/.netlify/functions/golf-logo-url"
  status = 200
  force = true

[[redirects]]
  from = "/api/golf/stripe-webhook"
  to = "/.netlify/functions/golf-stripe-webhook-background"
  status = 200
  force = true

[[redirects]]
  from = "/api/deploys/notify"
  to = "/.netlify/functions/deploy-notifier"
  status = 200
  force = true

[[redirects]]
  from = "/api/flush-overages"
  to = "/.netlify/functions/flush-user-overages-background"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Redirect API calls to the server function
# server.ts uses in-code config { path: "/api/*" } — Netlify auto-routes it
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

# Netlify Blobs serving function — public reads of stored objects.
# blobs-serve.mts uses in-code config { path: "/blobs/*" }; this redirect
# is a belt-and-suspenders fallback.
[[redirects]]
  from = "/blobs/*"
  to = "/.netlify/functions/blobs-serve"
  status = 200

# MCP (Model Context Protocol) server endpoint
# mcp.mts uses in-code config { path: "/mcp" } — Netlify auto-routes it.
# This redirect is kept as a belt-and-suspenders fallback.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# Canonical host: redirect www → apex (requires www.1commerce.online to be
# added as a domain alias in the Netlify dashboard for this rule to fire).
[[redirects]]
  from = "https://www.1commerce.online/*"
  to = "https://1commerce.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.1commerce.online/*"
  to = "https://1commerce.online/:splat"
  status = 301
  force = true

# Force HTTPS for non-www HTTP requests
[[redirects]]
  from = "http://1commerce.online/*"
  to = "https://1commerce.online/:splat"
  status = 301
  force = true

# SPA fallback — all non-API routes serve the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io https://connect.facebook.net https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: https://d.impactradius-event.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://checkout.stripe.com https://api.paypal.com https://www.facebook.com https://plausible.io https://api.anthropic.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.paypal.com; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# Ensure webhook routes accept Stripe POST requests
# CORS is locked down to production domain - webhooks are verified by signature
[[headers]]
  for = "/api/stripe/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://1commerce.online"
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature"

[[headers]]
  for = "/api/billing/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://1commerce.online"
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-DNS-Prefetch-Control = "off"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------------------
# Netlify-native integrations
# ----------------------------------------------------------------------------
# Netlify Blobs is enabled automatically — no toml config required. Server
# code uses it via server/storage.ts (STORAGE_BACKEND=auto by default).
#
# Image CDN: route blob image transforms through /.netlify/images. Example:
#   <img src="/.netlify/images?url=/blobs/products/foo.jpg&w=800&fit=cover">
# Allow remote sources for the Image CDN here:
[images]
  remote_images = [
    "^/blobs/.*",
    "^https://github\\.com/user-attachments/.*",
  ]

# Recommended Netlify extensions (install via Netlify UI → Extensions):
#   - Stripe       (auto-injects STRIPE_* env vars, dashboard widgets)
#   - Supabase     (auto-injects SUPABASE_* env vars; until removal completes)
#   - Neon         (auto-injects DATABASE_URL/NETLIFY_DATABASE_URL)
#   - Sentry       (release tracking + source maps)
