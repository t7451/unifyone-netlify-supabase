name: UnifyOne Dev-Agent (Autonomous Direct Push)

on:
  schedule:
    - cron: "0 13 * * *" # 6 AM PT daily (Canby, Oregon time)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TODO.md"
      - "TODO_COMPREHENSIVE.md"
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "drizzle/**"
      - "server/**"
      - "client/**"
      - "netlify/**"

permissions:
  contents: write
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
  REPO: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-agent:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with write access)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate mission briefing
        run: node .github/scripts/unifyone-orchestrator.js

      - name: Run UnifyOne Dev-Agent
        run: node .github/scripts/unifyone-dev-agent.js

      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-agent-report
          path: .agent-output/*

      - name: Push changes (if any were made)
        run: |
          if [ -z "$(git status --porcelain -- . ':!.agent-output')" ]; then
            echo "No changes to commit."
          else
            git config user.name "UnifyOne Dev-Agent"
            git config user.email "dev-agent@t7451.dev"
            git add -A -- . ':!.agent-output'
            git commit -m "dev-agent: autonomous fixes and improvements"
            git push
            echo "Changes pushed directly to main"
          fi
