name: UnifyOne Dev-Agent (Autonomous Direct Push)

on:
  schedule:
    - cron: '0 13 * * *'  # 6 AM PT daily (Canby, Oregon time)
  workflow_dispatch:      # Manual trigger
  push:
    branches: [ main ]
    paths:
      - 'TODO.md'
      - 'TODO_COMPREHENSIVE.md'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - 'drizzle/**'
      - 'server/**'
      - 'client/**'
      - 'netlify/**'

permissions:
  contents: write
  issues: read

jobs:
  dev-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with write access)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run UnifyOne Dev-Agent (Grok API + direct fixes)
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/unifyone-dev-agent.js

      - name: Push changes (if any were made)
        run: |
          if git diff --quiet HEAD --; then
            echo "No changes to commit."
          else
            git config user.name "UnifyOne Dev-Agent"
            git config user.email "dev-agent@t7451.dev"
            git add -A
            git commit -m "🤖 dev-agent: autonomous fixes & improvements

            Generated by Grok-powered UnifyOne Dev-Agent (direct push mode).
            Full reasoning and diffs available in workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
            echo "✅ Changes pushed directly to main"
          fi