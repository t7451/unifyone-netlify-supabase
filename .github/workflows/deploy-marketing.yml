name: deploy-marketing

# Deploys apps/marketing to Vercel.
# Requires three repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# If they are missing the job exits cleanly (no failures, no deploy).
#
# Push to main         -> production deploy (1commerce.online once DNS is cut)
# Push to other branch -> preview deploy (returns a vercel.app preview URL)
# Manual dispatch      -> production deploy from the chosen ref

on:
  push:
    branches: ["main"]
    paths:
      - "apps/marketing/**"
      - "vercel.json"
      - ".github/workflows/deploy-marketing.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/marketing/**"
      - "vercel.json"
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel target environment"
        required: true
        default: "production"
        type: choice
        options: ["production", "preview"]

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check that Vercel secrets are configured
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set. Skipping deploy. See apps/marketing/DEPLOYMENT.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Vercel CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g vercel@latest

      - name: Resolve target
        if: steps.check.outputs.skip == 'false'
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "env=preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        if: steps.check.outputs.skip == 'false'
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=$VERCEL_TOKEN

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ "${{ steps.target.outputs.env }}" = "production" ]; then
            vercel build --prod --token=$VERCEL_TOKEN
          else
            vercel build --token=$VERCEL_TOKEN
          fi

      - name: Deploy
        if: steps.check.outputs.skip == 'false'
        id: deploy
        run: |
          if [ "${{ steps.target.outputs.env }}" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          else
            url=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Comment preview URL on PR
        if: steps.check.outputs.skip == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            const body = `Marketing preview: ${url}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
