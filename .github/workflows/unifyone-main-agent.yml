name: UnifyOne Main Orchestrator (Spawns Multiple Agents)

on:
  schedule:
    - cron: '0 13 * * *'  # 6 AM PT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  dev-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/unifyone-dev-agent.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}

  ux-ui-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: node .github/scripts/unifyone-ux-ui-agent.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}

  quality-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  # Optional: Add more agents here (MCP, Security, Performance, etc.)
