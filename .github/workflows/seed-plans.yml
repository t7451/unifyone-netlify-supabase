name: Seed plans + Stripe products

# Run manually from the Actions tab (workflow_dispatch) or automatically
# after a push to main that touches the seed script or pricing catalog.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip DB + Stripe writes, just check env)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - scripts/seed-stripe-products.ts
      - shared/pricing.ts

permissions:
  contents: read

jobs:
  seed:
    name: Seed plans table + Stripe prices
    runs-on: ubuntu-latest

    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NETLIFY_DATABASE_URL: ${{ secrets.NETLIFY_DATABASE_URL }}
      NETLIFY_DATABASE_URL_UNPOOLED: ${{ secrets.NETLIFY_DATABASE_URL_UNPOOLED }}
      # Keep other required env vars quiet so the app doesn't throw at import
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run seed script
        run: pnpm seed:plans
