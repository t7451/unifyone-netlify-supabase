name: AI Citation Audit (weekly)

# WS0 — Weekly share-of-voice capture across AI search engines.
# Queries ChatGPT (web search), Perplexity, and OpenRouter/Sonar for the 20
# niche queries we track, detects UnifyOne brand citations, computes delta vs
# the prior week, and commits the JSON report to scripts/citation-reports/.
#
# Required secrets (set in repo Settings → Secrets):
#   OPENROUTER_API_KEY   — https://openrouter.ai  (proxies Perplexity sonar)
#   PERPLEXITY_API_KEY   — https://docs.perplexity.ai  (optional, direct API)
#   OPENAI_API_KEY       — https://platform.openai.com  (ChatGPT web search)
#
# The script skips any provider whose key is absent — partial runs are valid.

on:
  schedule:
    # Every Monday at 09:00 UTC (2 AM PT / 5 AM ET)
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print queries but skip API calls"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: citation-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Weekly citation audit
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run citation audit
        run: pnpm seo:citation-audit

      - name: Commit report
        run: |
          git config user.name "citation-bot"
          git config user.email "citation-bot@1commerce.online"
          # Only commit if a new report file was written
          if [ -n "$(git status --porcelain scripts/citation-reports/)" ]; then
            git add scripts/citation-reports/
            git commit -m "chore(seo): weekly citation audit $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new report to commit."
          fi
