name: UnifyOne UX/UI Agent (Frontend Quality Guardian)

on:
  schedule:
    - cron: '0 14 * * *'  # 7 AM PT daily
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '**.tsx'
      - '**.jsx'

permissions:
  contents: write
  issues: write

jobs:
  ux-ui-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run UX/UI Agent
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/unifyone-ux-ui-agent.js

      - name: Commit fixes if any
        run: |
          if git diff --quiet HEAD --; then
            echo "No UI/UX fixes needed."
          else
            git config user.name "UnifyOne UX/UI Agent"
            git config user.email "ux-agent@t7451.dev"
            git add -A
            git commit -m "🎨 ux-ui-agent: fixed UI/UX issues

            Automated fixes for broken features, accessibility, responsive issues, etc."
            git push
          fi