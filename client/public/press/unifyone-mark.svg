<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="UnifyOne emblem">
  <title>UnifyOne emblem</title>
  <rect width="512" height="512" rx="96" fill="#020202"/>
  <!-- Cathedral emblem: double square frame + cross -->
  <g transform="translate(128 128)">
    <rect x="0" y="0" width="256" height="256" rx="8" fill="none" stroke="#D4A843" stroke-opacity="0.4" stroke-width="10"/>
    <rect x="32" y="32" width="192" height="192" rx="4" fill="none" stroke="#D4A843" stroke-opacity="0.15" stroke-width="10"/>
    <line x1="128" y1="40" x2="128" y2="216" stroke="#D4A843" stroke-width="14"/>
    <line x1="40" y1="104" x2="216" y2="104" stroke="#D4A843" stroke-width="14"/>
  </g>
</svg>
