<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128" role="img" aria-label="UnifyOne by 1Commerce">
  <title>UnifyOne by 1Commerce</title>
  <!-- Cathedral emblem: double square frame + cross, the mark used in the app nav/footer -->
  <g transform="translate(20 32)">
    <rect x="0" y="0" width="64" height="64" rx="2" fill="none" stroke="#D4A843" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="8" y="8" width="48" height="48" rx="1" fill="none" stroke="#D4A843" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="32" y1="10" x2="32" y2="54" stroke="#D4A843" stroke-width="3"/>
    <line x1="10" y1="26" x2="54" y2="26" stroke="#D4A843" stroke-width="3"/>
  </g>
  <!-- Wordmark -->
  <text x="110" y="62" font-family="'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="40" font-weight="700" letter-spacing="6" fill="#F0E8D0">UNIFYONE</text>
  <text x="112" y="92" font-family="'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="14" font-weight="600" letter-spacing="5" fill="#D4A843">BY 1COMMERCE LLC</text>
</svg>
