<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- SEO: Title (46 chars — within 30-60 target) -->
    <title>UnifyOne — Multi-Tenant Commerce Platform</title>

    <!-- SEO: Meta description -->
    <meta name="description" content="UnifyOne unifies your commerce ecosystem — products, orders, payments, and analytics across every tenant, channel, and integration. Start free." />

    <!-- SEO: Keywords (6 focused — within 3-8 target) -->
    <meta name="keywords" content="multi-tenant commerce platform, ecommerce SaaS, order management, Shopify integration, payment processing, UnifyOne" />

    <!-- SEO: Author & robots -->
    <meta name="author" content="1Commerce Solutions" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://unifyone.1commercesolutions.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unifyone.1commercesolutions.com/" />
    <meta property="og:title" content="UnifyOne | Multi-Tenant Commerce Platform" />
    <meta property="og:description" content="Unify your entire commerce ecosystem — products, orders, payments, and analytics across every tenant, every channel, every integration." />
    <meta property="og:image" content="https://unifyone.1commercesolutions.com/og-image.png" />
    <meta property="og:site_name" content="UnifyOne" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@1CommerceSol" />
    <meta name="twitter:title" content="UnifyOne | Multi-Tenant Commerce Platform" />
    <meta name="twitter:description" content="Unify your entire commerce ecosystem — products, orders, payments, and analytics across every tenant, every channel, every integration." />
    <meta name="twitter:image" content="https://unifyone.1commercesolutions.com/og-image.png" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0A1128" />
    <meta name="application-name" content="UnifyOne" />
    <meta name="apple-mobile-web-app-title" content="UnifyOne" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "UnifyOne",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Multi-tenant commerce platform unifying products, orders, payments, and analytics across every channel and integration.",
      "url": "https://unifyone.1commercesolutions.com/",
      "author": {
        "@type": "Organization",
        "name": "1Commerce Solutions",
        "url": "https://1commercesolutions.com"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free trial available"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
