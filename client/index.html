    <!-- ── JSON-LD: FAQPage ──────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is UnifyOne?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "UnifyOne is a multi-tenant commerce platform built on the Cathedral Framework by 1Commerce / PNW Enterprises. It unifies products, orders, payments, and analytics across every tenant, channel, and integration — with AI Intelligence built in for intelligent earnings insights and route optimization for gig operators."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Cathedral Framework?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Cathedral Framework is 1Commerce's proprietary development philosophy — sequential, phased construction that prioritizes automated infrastructure before scaling traffic. Like a cathedral, every system is built to endure: foundational layers are completed and hardened before the next phase begins."
          }
        },
        {
          "@type": "Question",
          "name": "How does AI Intelligence work inside UnifyOne?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI Intelligence is embedded directly into UnifyOne's dashboard, Money Manager, and Gig Command pages. It analyzes your real earnings data, shift history, mileage, and platform performance to generate context-aware insights — route optimization tips, tax deduction summaries, challenge strategy, and daily business briefings."
          }
        },
        {
          "@type": "Question",
          "name": "Is UnifyOne suitable for gig economy workers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. UnifyOne was purpose-built for gig operators on platforms like DoorDash, Uber Eats, Instacart, and Amazon Flex. The Gig Command module tracks shifts, mileage, earnings per hour, and platform performance. AI Intelligence then surfaces actionable insights to maximize your hourly rate and minimize tax liability."
          }
        },
        {
          "@type": "Question",
          "name": "What integrations does UnifyOne support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "UnifyOne integrates with Shopify, Stripe, PayPal, Meta (Facebook/Instagram) via CAPI, Google Analytics, Mailchimp, DoorDash, Uber, Instacart, Amazon Flex, and AI Intelligence. Additional integrations are available through the API and webhook system."
          }
        },
        {
          "@type": "Question",
          "name": "How much does UnifyOne cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "UnifyOne offers three tiers: Acolyte (free — 1 tenant, core commerce tools), Architect ($49/month — 5 tenants, AI Intelligence, all payment rails, automation layer), and Cathedral ($149/month — unlimited tenants, white-label, custom domains, SLA guarantee). All plans include a 14-day free trial with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "What is multi-tenant commerce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Multi-tenant commerce means a single platform instance serves multiple independent businesses (tenants) with isolated data, branding, and settings. UnifyOne lets agencies, franchises, and holding companies manage multiple storefronts, brands, or client accounts from one unified dashboard — without data bleed between tenants."
          }
        },
        {
          "@type": "Question",
          "name": "Does UnifyOne support white-label reselling?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Cathedral tier includes full white-label support — custom domain, custom branding, and the ability to resell UnifyOne as your own product to clients. This is ideal for agencies and managed service providers who want to offer commerce infrastructure under their own brand."
          }
        },
        {
          "@type": "Question",
          "name": "Is UnifyOne GDPR and SOC 2 compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "UnifyOne is built with compliance-first architecture. The platform is GDPR-ready with data isolation per tenant, right-to-erasure workflows, and consent management. SOC 2 compliance is maintained through infrastructure-level controls on the underlying cloud provider."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get started with UnifyOne?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Click 'Begin Construction' on the homepage to start your free 14-day trial. No credit card required. You'll be guided through tenant setup, integration configuration, and your first AI Intelligence insight within minutes of signing up."
          }
        }
      ]
    }
    </script>
