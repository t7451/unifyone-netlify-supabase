<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <!-- SEO: Title (46 chars — within 30-60 target) -->

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meet Your AI Gig Co-Pilot — Manus AI is now inside UnifyOne" />
    <meta property="og:site_name" content="UnifyOne" />

    <meta name="twitter:image:alt" content="Meet Your AI Gig Co-Pilot — Manus AI is now inside UnifyOne" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
